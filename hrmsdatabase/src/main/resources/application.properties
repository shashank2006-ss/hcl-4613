spring.application.name=hrmsdatabase

## ===================================================================
## MySQL Database Datasource Configuration
## ===================================================================
# The URL points to localhost on default MySQL port 3306 with schema 'abeshclhrms'
spring.datasource.url=jdbc:mysql://localhost:3306/abeshclhrms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Tharking@123

## ===================================================================
## JPA & Hibernate Settings
## ===================================================================
## Specifies MySQL as the dialect target
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
## Controls database structure modification: 'update' keeps schema modifications intact
spring.jpa.hibernate.ddl-auto=update
## Optional: Prints executed SQL statements directly to the console logs
spring.jpa.show-sql=true